# Runs the Rust webhook server. Set WEBHOOK_SECRET (e.g. in a .env file next to
# this compose file — see .env.example) before `docker compose up`.
services:
  webhook:
    build: ./server
    image: indeed-key-webhook
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET (see .env.example)}
      BIND_ADDR: 0.0.0.0:8080
      DB_PATH: /data/codes.db
    volumes:
      - webhook-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  webhook-data:
